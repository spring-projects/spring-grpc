plugins {
	id 'java'
	id 'org.springframework.boot' version "$bootVersion"
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.graalvm.buildtools.native' version '1.1.8'
	id 'com.google.protobuf' version '0.10.0'
}

group = 'com.example'
version = '1.1.2-SNAPSHOT'

def toolchainVersion() {
	if (project.hasProperty('testToolchain')) {
		return project.property('testToolchain').toString().toInteger()
	}
	return 17
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(toolchainVersion())
	}
}

repositories {
	mavenLocal()
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
	maven { url 'https://repo.spring.io/snapshot' }
}

if (project.hasProperty('springGrpcVersion')) ext['spring-grpc.version'] = project.property('springGrpcVersion')

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-grpc-server'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	testImplementation 'org.springframework.boot:spring-boot-starter-grpc-server-test'

	testRuntimeOnly "io.netty:netty-transport-native-epoll::linux-x86_64"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

protobuf {
	plugins {
		grpc {}
	}
}

test {
	useJUnitPlatform()
	testLogging.showStandardStreams = true
	outputs.upToDateWhen { false }
}

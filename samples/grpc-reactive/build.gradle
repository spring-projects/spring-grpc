plugins {
	id 'java'
	id 'org.springframework.boot' version "$bootVersion"
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.protobuf' version '0.10.0'
}

group = 'com.example'
version = '1.1.2-SNAPSHOT'

def toolchainVersion() {
	if (project.hasProperty('testToolchain')) {
		return project.property('testToolchain').toString().toInteger()
	}
	return 17
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(toolchainVersion())
	}
}

repositories {
	mavenCentral()
	mavenLocal()
	maven { url 'https://repo.spring.io/milestone' }
	maven { url 'https://repo.spring.io/snapshot' }
}

if (project.hasProperty('springGrpcVersion')) ext['spring-grpc.version'] = project.property('springGrpcVersion')

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-grpc-server'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.projectreactor:reactor-core'
	implementation 'com.salesforce.servicelibs:reactor-grpc-stub:1.2.4'

	compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

	testImplementation 'org.springframework.boot:spring-boot-starter-grpc-client-test'
	testImplementation 'io.projectreactor:reactor-test'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly "io.netty:netty-transport-native-epoll::linux-x86_64"
}

test {
	useJUnitPlatform()
	testLogging.showStandardStreams = true
	outputs.upToDateWhen { false }
}

protobuf {
	plugins {
		grpc {}
		reactor {
			artifact = "com.salesforce.servicelibs:reactor-grpc:1.2.4"
		}
	}
	generateProtoTasks {
		all()*.plugins {
			reactor {}
		}
	}
}

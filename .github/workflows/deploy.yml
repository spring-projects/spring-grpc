# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven
name: Deploy Jars
on:
  pull_request:
    branches:
      - 'main-internal'
    paths-ignore:
      - '.github/**'
  push:
    branches:
      - 'main-internal'
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  build:
    name: Build and Deploy On Push

    runs-on: ubuntu-latest
    if: ${{ github.repository == 'spring-projects/spring-grpc-commercial' }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven
    - name: Deploy with Maven
      env:
        COMMERCIAL_RELEASE_REPO_URL: ${{ vars.COMMERCIAL_RELEASE_REPO_URL }}
        COMMERCIAL_SNAPSHOT_REPO_URL: ${{ vars.COMMERCIAL_SNAPSHOT_REPO_URL }}
        COMMERCIAL_ARTIFACTORY_RO_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
        COMMERCIAL_ARTIFACTORY_RO_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        deploy_repository_url: ${{ secrets.COMMERCIAL_ARTIFACTORY_URL }}
        spring_username: ${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}
        spring_password: ${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD }}
        central_username: ${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}
        central_password: ${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD }}
        signing_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.GPG_PASSPHRASE }}
      run: |
          echo "${signing_key}" > private.asc
          gpg --import --batch --no-tty private.asc
          ./mvnw -B install
